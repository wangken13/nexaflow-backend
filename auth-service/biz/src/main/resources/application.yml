server:
  port: 18101

spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 11
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.2.128:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.2.128}:3306/trade_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  sms:
    provider: ${SMS_PROVIDER:spug}
    spug:
      name: ${SPUG_SMS_NAME:NexaFlow}
      # SMS_ENDPOINT is retained as a compatible fallback for existing deployments.
      login-url: ${SPUG_SMS_LOGIN_URL:${SMS_ENDPOINT:}}
      register-url: ${SPUG_SMS_REGISTER_URL:${SMS_ENDPOINT:}}
    endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
    access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    login-template-code: ${ALIYUN_SMS_LOGIN_TEMPLATE_CODE:}
    register-template-code: ${ALIYUN_SMS_REGISTER_TEMPLATE_CODE:}
  wechat:
    open-app-id: ${WECHAT_OPEN_APP_ID:}
    open-app-secret: ${WECHAT_OPEN_APP_SECRET:}
    redirect-uri: ${WECHAT_OPEN_REDIRECT_URI:}
    frontend-login-uri: ${WECHAT_FRONTEND_LOGIN_URI:http://localhost:5173/login}
