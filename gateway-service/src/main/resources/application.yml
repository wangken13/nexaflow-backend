server:
  port: 18080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.2.128:8848}
        ip: ${SERVICE_IP:192.168.2.173}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.2.128:8858}
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates: [ Path=/api/auth/** ]
              filters: [ StripPrefix=1 ]
            - id: tenant-service
              uri: lb://tenant-service
              predicates: [ Path=/api/tenant/** ]
              filters: [ StripPrefix=1 ]
            - id: customer-service
              uri: lb://customer-service
              predicates: [ Path=/api/customer/** ]
              filters: [ StripPrefix=1 ]
            - id: inquiry-service
              uri: lb://inquiry-service
              predicates: [ Path=/api/inquiry/** ]
              filters: [ StripPrefix=1 ]
            - id: ai-service
              uri: lb://ai-service
              predicates: [ Path=/api/ai/** ]
              filters: [ StripPrefix=1 ]
            - id: quotation-service
              uri: lb://quotation-service
              predicates: [ Path=/api/quotation/** ]
              filters: [ StripPrefix=1 ]
            - id: order-service
              uri: lb://order-service
              predicates: [ Path=/api/order/** ]
              filters: [ StripPrefix=1 ]
            - id: task-service
              uri: lb://task-service
              predicates: [ Path=/api/task/** ]
              filters: [ StripPrefix=1 ]
            - id: notification-service
              uri: lb://notification-service
              predicates: [ Path=/api/notification/** ]
              filters: [ StripPrefix=1 ]
            - id: file-service
              uri: lb://file-service
              predicates: [ Path=/api/file/** ]
              filters: [ StripPrefix=1 ]

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
