services:
  mysql:
    image: mysql:8.4
    container_name: trade-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}"
      MYSQL_DATABASE: trade_ai
      MYSQL_USER: "${MYSQL_APP_USER:?MYSQL_APP_USER must be set}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: trade-ai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: trade-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER must be set}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}"
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: trade-ai-minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: trade-ai-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN must be set}"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY must be set}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE must be set}"
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${MYSQL_HOST:-192.168.2.128}
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}"
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false
    ports:
      - "8848:8848"
      - "9848:9848"

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: trade-ai-sentinel
    ports:
      - "8858:8858"

  gateway-service:
    profiles: ["app"]
    build: ../gateway-service
    environment: &app-env
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set to a random value of at least 32 bytes}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE must be true behind HTTPS or false only for local HTTP development}"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "11"
      SPRING_CLOUD_NACOS_USERNAME: "${NACOS_USERNAME:?NACOS_USERNAME must be set}"
      SPRING_CLOUD_NACOS_PASSWORD: "${NACOS_PASSWORD:?NACOS_PASSWORD must be set}"
      NACOS_ADDR: 192.168.2.128:8848
      SENTINEL_DASHBOARD: 192.168.2.128:8858
    ports:
      - "18080:18080"
    depends_on: [nacos, sentinel]

  auth-service:
    profiles: ["app"]
    build: ../auth-service/biz
    environment:
      <<: *app-env
      MYSQL_HOST: 192.168.2.128
      MYSQL_USER: "${MYSQL_APP_USER:?MYSQL_APP_USER must be set}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}"
      SMS_ENDPOINT: ${SMS_ENDPOINT:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      WECHAT_OPEN_APP_ID: ${WECHAT_OPEN_APP_ID:-}
      WECHAT_OPEN_REDIRECT_URI: ${WECHAT_OPEN_REDIRECT_URI:-}
    expose:
      - "18101"
    depends_on: [mysql, nacos]

  tenant-service:
    profiles: ["app"]
    build: ../tenant-service/biz
    environment:
      <<: *app-env
      MYSQL_HOST: 192.168.2.128
      MYSQL_USER: "${MYSQL_APP_USER:?MYSQL_APP_USER must be set}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}"
    expose:
      - "18102"
    depends_on: [mysql, nacos]

  customer-service:
    profiles: ["app"]
    build: ../customer-service/biz
    environment: &business-env
      <<: *app-env
      MYSQL_HOST: 192.168.2.128
      MYSQL_USER: "${MYSQL_APP_USER:?MYSQL_APP_USER must be set}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}"
      RABBITMQ_HOST: 192.168.2.128
      RABBITMQ_USER: "${RABBITMQ_USER:?RABBITMQ_USER must be set}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}"
    expose:
      - "18103"
    depends_on: [mysql, rabbitmq, nacos]

  inquiry-service:
    profiles: ["app"]
    build: ../inquiry-service/biz
    environment: *business-env
    expose:
      - "18104"
    depends_on: [mysql, rabbitmq, nacos]

  ai-service:
    profiles: ["app"]
    build: ../ai-service/biz
    environment:
      <<: *business-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    expose:
      - "18105"
    depends_on: [rabbitmq, nacos]

  quotation-service:
    profiles: ["app"]
    build: ../quotation-service/biz
    environment: *business-env
    expose:
      - "18106"
    depends_on: [mysql, nacos]

  order-service:
    profiles: ["app"]
    build: ../order-service/biz
    environment: *business-env
    expose:
      - "18107"
    depends_on: [mysql, rabbitmq, nacos]

  task-service:
    profiles: ["app"]
    build: ../task-service/biz
    environment: *business-env
    expose:
      - "18108"
    depends_on: [mysql, rabbitmq, nacos]

  notification-service:
    profiles: ["app"]
    build: ../notification-service/biz
    environment: *business-env
    expose:
      - "18109"
    depends_on: [rabbitmq, nacos]

  file-service:
    profiles: ["app"]
    build: ../file-service/biz
    environment:
      <<: *app-env
      MINIO_ENDPOINT: http://192.168.2.128:9000
      MINIO_ENABLED: "true"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    expose:
      - "18110"
    depends_on: [minio, nacos]

volumes:
  mysql-data:
  minio-data:

