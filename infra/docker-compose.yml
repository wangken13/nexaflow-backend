services:
  mysql:
    image: mysql:8.4
    container_name: trade-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: trade_ai
      MYSQL_USER: trade
      MYSQL_PASSWORD: trade123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: trade-ai-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: trade-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: trade
      RABBITMQ_DEFAULT_PASS: trade123
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: trade-ai-minio
    environment:
      MINIO_ROOT_USER: trade
      MINIO_ROOT_PASSWORD: trade123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: trade-ai-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: trade-ai-sentinel
    ports:
      - "8858:8858"

  gateway-service:
    profiles: ["app"]
    build: ../backend/gateway-service
    environment: &app-env
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NACOS_ADDR: 192.168.2.128:8848
      SENTINEL_DASHBOARD: sentinel:8858
    ports:
      - "8080:8080"
    depends_on: [nacos, sentinel]

  auth-service:
    profiles: ["app"]
    build: ../backend/auth-service
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_USER: trade
      MYSQL_PASSWORD: trade123
    ports:
      - "8101:8101"
    depends_on: [mysql, nacos]

  tenant-service:
    profiles: ["app"]
    build: ../backend/tenant-service
    environment:
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_USER: trade
      MYSQL_PASSWORD: trade123
    ports:
      - "8102:8102"
    depends_on: [mysql, nacos]

  customer-service:
    profiles: ["app"]
    build: ../backend/customer-service
    environment: &business-env
      <<: *app-env
      MYSQL_HOST: mysql
      MYSQL_USER: trade
      MYSQL_PASSWORD: trade123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: trade
      RABBITMQ_PASSWORD: trade123
    ports:
      - "8103:8103"
    depends_on: [mysql, rabbitmq, nacos]

  inquiry-service:
    profiles: ["app"]
    build: ../backend/inquiry-service
    environment: *business-env
    ports:
      - "8104:8104"
    depends_on: [mysql, rabbitmq, nacos]

  ai-service:
    profiles: ["app"]
    build: ../backend/ai-service
    environment:
      <<: *business-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8105:8105"
    depends_on: [rabbitmq, nacos]

  quotation-service:
    profiles: ["app"]
    build: ../backend/quotation-service
    environment: *business-env
    ports:
      - "8106:8106"
    depends_on: [mysql, nacos]

  order-service:
    profiles: ["app"]
    build: ../backend/order-service
    environment: *business-env
    ports:
      - "8107:8107"
    depends_on: [mysql, rabbitmq, nacos]

  task-service:
    profiles: ["app"]
    build: ../backend/task-service
    environment: *business-env
    ports:
      - "8108:8108"
    depends_on: [mysql, rabbitmq, nacos]

  notification-service:
    profiles: ["app"]
    build: ../backend/notification-service
    environment: *business-env
    ports:
      - "8109:8109"
    depends_on: [rabbitmq, nacos]

  file-service:
    profiles: ["app"]
    build: ../backend/file-service
    environment:
      <<: *app-env
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: trade
      MINIO_SECRET_KEY: trade123
    ports:
      - "8110:8110"
    depends_on: [minio, nacos]

volumes:
  mysql-data:
  minio-data:
