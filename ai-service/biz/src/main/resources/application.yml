server:
  port: 18105
spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 11
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.2.128:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.2.128}:3306/trade_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:${DEEPSEEK_APIKEY:${OPENAI_API_KEY:}}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.2.128}
    port: 5672
    username: ${RABBITMQ_USER:trade}
    password: ${RABBITMQ_PASSWORD:trade123}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
        default-requeue-rejected: false
