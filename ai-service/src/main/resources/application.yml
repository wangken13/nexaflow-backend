server:
  port: 8105
spring:
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.2.128:8848}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:trade}
    password: ${RABBITMQ_PASSWORD:trade123}
