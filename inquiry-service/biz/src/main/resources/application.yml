server:
  port: 18104
spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 11
  application:
    name: inquiry-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.2.128:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.2.128}:3306/trade_ai?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.2.128}
    port: 5672
    username: ${RABBITMQ_USER:trade}
    password: ${RABBITMQ_PASSWORD:trade123}
